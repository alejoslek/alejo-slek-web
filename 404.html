<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esta página no existe · Alejo Slek</title>
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;800;900&display=swap" rel="stylesheet">
<style>
/* Página de error. Las rutas empiezan con / porque esta página se muestra en cualquier dirección que no existe. */
:root{--bg:#ffffff;--surface:#f3f1ef;--fg:#141414;--muted:#5f5a57;--accent:#e5482d;--gutter:clamp(18px,4vw,48px);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:400 18px/1.55 "Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100svh;display:flex;flex-direction:column}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding:0 var(--gutter);width:100%}
.top{display:flex;align-items:center;padding-top:18px;padding-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;text-decoration:none}
.brand svg{width:34px;height:34px;flex:none}
main{flex:1;display:grid;align-content:center;gap:22px;padding-top:6vh;padding-bottom:12vh}
.code{color:var(--fg);font-weight:900;font-size:clamp(96px,26vw,260px);line-height:.82;letter-spacing:-.065em;margin:0 0 0 -.04em}
.blocks{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:420px}
.blocks i{aspect-ratio:1;background:var(--surface)}
.blocks i.r{background:var(--accent)}
.blocks i.k{background:var(--fg)}
h1{font-weight:800;font-size:clamp(30px,5vw,56px);line-height:1.04;letter-spacing:-.04em;margin:0;max-width:16ch}
p{color:var(--muted);margin:0;max-width:44ch}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 24px;font-weight:800;font-size:17px;text-decoration:none;background:var(--fg);color:#fff}
.btn.line{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 2px var(--fg)}
</style>
</head>
<body>
<header class="top wrap">
  <a class="brand" href="/" aria-label="Alejo Slek, inicio"><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" fill="#e5482d"/><text x="20" y="27.5" text-anchor="middle" font-family="Archivo,sans-serif" font-weight="900" font-size="18" fill="#141414" letter-spacing="-1">AS</text></svg>Sistemas y webs</a>
</header>
<main class="wrap">
  <p class="code" aria-hidden="true">404</p>
  <div class="blocks" aria-hidden="true"><i class="r"></i><i></i><i class="k"></i><i></i><i></i><i class="r"></i></div>
  <h1>Esta página no existe.</h1>
  <p>Puede que el link esté mal escrito o que la página se haya movido. Desde el inicio encontrás todo.</p>
  <div class="btns"><a class="btn" href="/">Ir al inicio</a><a class="btn line" href="/#contacto">Escribime</a></div>
</main>
</body>
</html>
